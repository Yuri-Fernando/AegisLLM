name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce release policy
        run: >-
          echo "Release policy: publicar somente artefatos aprovados pelos gates"