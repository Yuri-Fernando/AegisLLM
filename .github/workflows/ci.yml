name: aegis-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10.8", cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[api,dev]"
      - run: ruff check .
      - run: python -m pytest
      - run: bandit -q -r aegis apps redteam security_agents evaluation