name: llm-evaluation
on: [pull_request]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10.8"}
      - run: python -c "from evaluation import run_benchmark; from evaluation.gates import evaluate_gates; report=run_benchmark(); assert evaluate_gates(report)['passed'], report; print(report)"