name: redteam-local
on: [pull_request]
permissions:
  contents: read
jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10.8"}
      - run: python -c "from redteam.runner import run_red_team,summarize; report=summarize(run_red_team()); assert report['attack_success_rate'] <= .05, report; print(report)"